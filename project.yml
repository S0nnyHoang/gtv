# Cấu hình XcodeGen. Sửa file này rồi chạy `xcodegen` để sinh lại GTV.xcodeproj.
name: GTV

options:
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
  developmentLanguage: vi

packages:
  # Tự động cập nhật (https://sparkle-project.org)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    MARKETING_VERSION: "1.11"
    # Số build = phiên bản: Sparkle so sánh CFBundleVersion (hiểu dạng 1.11.1), chỉ cần tăng MARKETING_VERSION.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    SWIFT_VERSION: "5.0"
    # Mặc định ký ad-hoc (chạy được trên máy build). Khi phát hành, build.sh truyền
    # DEVELOPMENT_TEAM + CODE_SIGN_IDENTITY "Developer ID Application" để notarize.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Tắt khi ký ad-hoc: Hardened Runtime chỉ cho nạp thư viện cùng Team ID, mà bản ad-hoc không có Team ID
    # nên Sparkle.framework bị từ chối ("not valid for use in process"). build.sh bật lại khi ký Developer ID
    # (bắt buộc để notarize; khi đó app và Sparkle cùng Team ID).
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: non-global

targets:
  # Bộ xử lý gõ thuần Swift (không phụ thuộc AppKit).
  VietEngine:
    type: library.static
    platform: macOS
    sources: [Sources/VietEngine]
    settings:
      base:
        PRODUCT_NAME: VietEngine

  # Bộ gõ (InputMethodKit) + biểu tượng V/E trên thanh menu.
  # Được nhúng vào GTV.app và cài vào ~/Library/Input Methods khi mở GTV.
  GTVInput:
    type: application
    platform: macOS
    sources:
      - Sources/GTVInput
      - path: Resources/icon.tiff
        buildPhase: resources
      - path: Resources/icon-vi.tiff
        buildPhase: resources
      - path: Resources/icon-en.tiff
        buildPhase: resources
    dependencies:
      - target: VietEngine
      - package: Sparkle
      - sdk: InputMethodKit.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: GTVInput
        PRODUCT_BUNDLE_IDENTIFIER: com.gtv.inputmethod.GTV
        INFOPLIST_FILE: Resources/Input-Info.plist
        SKIP_INSTALL: YES

  # App người dùng mở (trong /Applications).
  GTV:
    type: application
    platform: macOS
    sources:
      - Sources/GTVLauncher
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: GTVInput
        embed: true
        codeSign: true
        copy:
          destination: resources
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: GTV
        PRODUCT_BUNDLE_IDENTIFIER: com.gtv.GTV
        INFOPLIST_FILE: Resources/Launcher-Info.plist

  VietEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/VietEngineTests]
    dependencies:
      - target: VietEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gtv.VietEngineTests

schemes:
  GTV:
    build:
      targets:
        GTV: all
        VietEngineTests: [test]
    test:
      targets: [VietEngineTests]
    run:
      config: Debug
    archive:
      config: Release
